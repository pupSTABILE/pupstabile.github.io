<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pup.STABILE | Architectural Cyber-Trance // Official Portal</title>
    
    <!-- Custom Favicon Suite Links -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

    <!-- Google Fonts for sharp technical typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #05070c;
            --bg-glass: rgba(10, 14, 26, 0.55);
            --bg-glass-hover: rgba(16, 22, 42, 0.75);
            --bg-panel: rgba(10, 14, 26, 0.85);
            --accent-cyan: #00f2f2;
            --accent-orange: #ff5500;
            --accent-purple: #9d4edd;
            --accent-gold: #ffd700;
            --accent-pink: #ff3366;
            --text-main: #f0f3f8;
            --text-muted: #8b9bb4;
            --border-color: rgba(0, 242, 242, 0.18);
            --border-hover: rgba(0, 242, 242, 0.45);
            --glow-cyan: 0 0 18px rgba(0, 242, 242, 0.3);
            --glow-orange: 0 0 18px rgba(255, 85, 0, 0.3);
            --glow-purple: 0 0 18px rgba(157, 78, 221, 0.3);
            --glow-gold: 0 0 18px rgba(255, 215, 0, 0.3);
            --glow-pink: 0 0 18px rgba(255, 51, 102, 0.35);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        /* STREAMLINED HERO LAUNCHPAD STYLES */
        .hero-stream-launchpad {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .launchpad-title {
            font-size: 0.78rem;
            color: var(--accent-cyan);
            letter-spacing: 1.5px;
            font-weight: bold;
        }
        .launchpad-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .launchpad-card {
            background: rgba(10, 14, 26, 0.75);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .launchpad-card:hover {
            border-color: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
        }
        .launchpad-card.active-release {
            border-color: var(--accent-orange);
            background: rgba(255, 85, 0, 0.08);
            box-shadow: var(--glow-orange);
        }
        .card-header {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .card-badge {
            font-size: 0.65rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .badge-cyan { color: var(--accent-cyan); }
        .badge-orange { color: var(--accent-orange); }
        .badge-gold { color: var(--accent-gold); }
        
        .card-song-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
        }
        .card-btn-group {
            display: flex;
            gap: 8px;
        }
        .btn-dsp {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            font-size: 0.78rem;
            font-weight: 700;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .btn-dsp.sp:hover, .btn-dsp.sp.active {
            background: #1db954;
            border-color: #1db954;
            color: #000;
            box-shadow: 0 0 12px rgba(29, 185, 84, 0.5);
        }
        .btn-dsp.am:hover, .btn-dsp.am.active {
            background: #fc3c44;
            border-color: #fc3c44;
            color: #fff;
            box-shadow: 0 0 12px rgba(252, 60, 68, 0.5);
        }
        .btn-dsp.gold {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
            color: #000;
        }
        .btn-dsp.gold:hover {
            box-shadow: var(--glow-gold);
            transform: translateY(-2px);
        }
        @media (max-width: 600px) {
            .launchpad-card { flex-direction: column; align-items: flex-start; gap: 8px; }
            .card-btn-group { width: 100%; justify-content: flex-start; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 242, 242, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }
        /* Fullscreen Matrix Background Canvas */
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
            opacity: 0.35;
        }
        h1, h2, h3, h4, .font-tech {
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: -0.02em;
        }
        .mono {
            font-family: 'Space Mono', monospace;
        }
        a {
            color: var(--accent-cyan);
            text-decoration: none;
            transition: all 0.3s ease;
        }
        a:hover {
            color: #fff;
            text-shadow: 0 0 10px var(--accent-cyan);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        /* Top Terminal Ticker Banner */
        .terminal-banner {
            background: rgba(0, 242, 242, 0.05);
            border-bottom: 1px solid rgba(0, 242, 242, 0.2);
            padding: 6px 0;
            font-size: 0.75rem;
            color: var(--accent-cyan);
            white-space: nowrap;
            overflow: hidden;
            position: relative;
            z-index: 1001;
        }
        .ticker-text {
            display: inline-block;
            animation: ticker 25s linear infinite;
        }
        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* Header Navigation */
        header {
            position: fixed;
            top: 30px;
            left: 0;
            width: 100%;
            background: rgba(5, 7, 12, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
        }
        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 85px;
            padding: 10px 0;
        }
        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 2px;
        }
        .brand span {
            color: var(--accent-cyan);
            text-shadow: var(--glow-cyan);
        }
        nav ul {
            display: flex;
            list-style: none;
            gap: 28px;
        }
        nav ul a {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }
        nav ul a:hover, nav ul a.active {
            color: var(--accent-cyan);
            text-shadow: var(--glow-cyan);
        }

        /* Hero Sector */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 130px;
            padding-bottom: 60px;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            gap: 50px;
            align-items: start;
        }
        .hero-text {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .badge-terminal {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 242, 242, 0.08);
            border: 1px solid rgba(0, 242, 242, 0.3);
            padding: 6px 14px;
            border-radius: 4px;
            width: fit-content;
            color: var(--accent-cyan);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .badge-terminal span {
            width: 8px;
            height: 8px;
            background-color: var(--accent-cyan);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--accent-cyan);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.5; }
        }
        .hero h1 {
            font-size: 4.5rem;
            line-height: 0.95;
            font-weight: 800;
            text-transform: uppercase;
            color: #fff;
        }
        .hero h1 span {
            color: transparent;
            -webkit-text-stroke: 1px rgba(0, 242, 242, 0.85);
            filter: drop-shadow(var(--glow-cyan));
        }
        
        /* INLINE PROFILE FRAME WITH HERO SOCIAL ICONS */
        .profile-section-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            margin: 6px 0;
        }
        .profile-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
        }
        .profile-glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-orange), var(--accent-purple), var(--accent-gold));
            filter: blur(16px);
            opacity: 0.55;
            animation: rotateGlow 8s infinite linear;
        }
        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .profile-container {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            overflow: hidden;
            box-shadow: var(--glow-cyan);
        }
        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.5s ease;
        }
        .profile-container:hover .profile-img {
            transform: scale(1.06);
        }

        /* HERO EMBEDDED SOCIAL GLYPH BUTTONS UNDER HEADSHOT */
        .hero-social-links {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .social-icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(10, 14, 26, 0.75);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            backdrop-filter: blur(8px);
        }
        .social-icon-btn:hover {
            transform: translateY(-3px);
            color: #fff;
        }
        .social-icon-btn.yt:hover { border-color: #ff0000; color: #ff0000; box-shadow: 0 0 14px rgba(255,0,0,0.5); }
        .social-icon-btn.ig:hover { border-color: #e1306c; color: #e1306c; box-shadow: 0 0 14px rgba(225,48,108,0.5); }
        .social-icon-btn.fb:hover { border-color: #1877f2; color: #1877f2; box-shadow: 0 0 14px rgba(24,119,242,0.5); }
        .social-icon-btn.sp:hover { border-color: #1db954; color: #1db954; box-shadow: 0 0 14px rgba(29,185,84,0.5); }
        .social-icon-btn.am:hover { border-color: #fc3c44; color: #fc3c44; box-shadow: 0 0 14px rgba(252,60,68,0.5); }
        .social-icon-btn.sc:hover { border-color: #ff5500; color: #ff5500; box-shadow: 0 0 14px rgba(255,85,0,0.5); }
        .social-icon-btn.mc:hover { border-color: #5000ff; color: #5000ff; box-shadow: 0 0 14px rgba(80,0,255,0.5); }

        .hero-subtitle {
            font-size: 1.15rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .hero-desc {
            color: var(--text-muted);
            font-size: 1.02rem;
        }
        .hero-cta {
            display: flex;
            gap: 14px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 28px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            font-family: 'Space Grotesk', sans-serif;
        }
        .btn-primary {
            background-color: var(--accent-orange);
            color: #fff;
            border: 1px solid var(--accent-orange);
            box-shadow: var(--glow-orange);
        }
        .btn-primary:hover {
            background-color: transparent;
            color: var(--accent-orange);
            box-shadow: 0 0 25px rgba(255, 85, 0, 0.5);
            border-color: var(--accent-orange);
            transform: translateY(-2px);
        }
        .btn-secondary {
            background-color: transparent;
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 242, 242, 0.35);
        }
        .btn-secondary:hover {
            background-color: rgba(0, 242, 242, 0.08);
            border-color: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
            transform: translateY(-2px);
        }

        /* EMBEDDED SPOTIFY ARTIST PLAYER CONTAINER */
        .spotify-player-wrapper {
            margin-top: 12px;
            background: rgba(10, 14, 26, 0.75);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            box-shadow: var(--glow-cyan);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .spotify-player-wrapper:hover {
            border-color: var(--accent-cyan);
        }
        .spotify-player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.72rem;
            letter-spacing: 1.5px;
            color: var(--accent-cyan);
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Diagnostic Telemetry Panel with Neon-Orange Glow Border */
        .hero-panel {
            background: var(--bg-panel);
            border: 2px solid var(--accent-orange);
            padding: 24px;
            border-radius: 10px;
            box-shadow: var(--glow-orange);
            position: relative;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 85, 0, 0.2);
            padding-bottom: 12px;
            margin-bottom: 18px;
        }
        .panel-dot-group {
            display: flex;
            gap: 6px;
        }
        .panel-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .panel-dot:nth-child(1) { background-color: var(--accent-orange); }
        .panel-dot:nth-child(2) { background-color: var(--accent-gold); }
        .panel-dot:nth-child(3) { background-color: var(--accent-cyan); }
        
        .diagnostic-line {
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-muted);
        }
        .diagnostic-line span.label {
            color: var(--accent-cyan);
        }
        .diagnostic-line span.value {
            color: #fff;
            font-weight: 600;
        }

        /* REAL-TIME COUNTDOWN CLOCKS GRID */
        .countdown-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 18px;
            border-top: 1px dashed rgba(255, 85, 0, 0.25);
            padding-top: 18px;
        }
        .clock-widget {
            background: rgba(5, 7, 12, 0.75);
            border-radius: 6px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent-cyan);
        }
        .clock-widget.w-cyan { border-left-color: var(--accent-cyan); }
        .clock-widget.w-orange { border-left-color: var(--accent-orange); }
        .clock-widget.w-purple { border-left-color: var(--accent-purple); }
        .clock-widget.w-pink { border-left-color: var(--accent-pink); }
        .clock-widget.w-gold { border-left-color: var(--accent-gold); }
        
        .clock-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .clock-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            font-weight: bold;
        }
        .clock-sub {
            font-size: 0.75rem;
            color: rgba(240, 243, 248, 0.85);
            font-weight: 600;
        }
        .clock-timer {
            font-family: 'Space Mono', monospace;
            font-size: 1.05rem;
            font-weight: bold;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            min-width: 145px;
            text-align: right;
        }
        .w-cyan .clock-timer { color: var(--accent-cyan); text-shadow: var(--glow-cyan); }
        .w-orange .clock-timer { color: var(--accent-orange); text-shadow: var(--glow-orange); }
        .w-purple .clock-timer { color: var(--accent-purple); text-shadow: var(--glow-purple); }
        .w-gold .clock-timer { color: var(--accent-gold); text-shadow: var(--glow-gold); }
        .w-pink .clock-timer { color: var(--accent-pink);
